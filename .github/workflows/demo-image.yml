name: Publish public demo image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:localization
      - run: node --test scripts/docs/test/*.test.mjs scripts/demo/test/capture-public-demo.test.mjs
      - run: node scripts/docs/verify-architecture.mjs
      - run: node scripts/docs/verify-readme.mjs --local
      - run: node --test infra/demo/test/*.test.mjs
      - run: pnpm eval:supplier-replies:verify
      - run: node --test scripts/evals/test/*.test.mjs
      - run: pnpm eval:supplier-replies:check
      - run: pnpm exec tsx --test scripts/demo/test/seed-public-demo.test.ts
      - run: pnpm --filter @readywork/app-console build

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-demo
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/production/Dockerfile
          target: readywork-demo
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            READYWORK_PUBLIC_DEMO=1
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
