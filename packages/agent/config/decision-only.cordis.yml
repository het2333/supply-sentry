# Readywork 的 Harness 只负责推理与结构化决策。
# 此组合刻意不挂载 Bash、文件系统、MCP、邮件或 ERP 工具；业务动作必须以
# AgentResult.actions 建议返回，再由 Readywork Action Gateway 授权和执行。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    # Per-agent route is injected only by the server-owned runtime config; clients
    # and task payloads cannot raise its reasoning cost or token budget.
    reasoningEffort: !!js process.env.READYWORK_DSH_REASONING_EFFORT || 'max'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: 'You are Readywork decision runtime. Return decisions only and never execute external side effects.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none
