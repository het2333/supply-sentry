name: readywork-preview

x-app-service: &app-service
  image: ${READYWORK_APP_IMAGE:-readywork-app:preview}
  build:
    context: ../..
    dockerfile: infra/production/Dockerfile
    target: readywork-app
  restart: unless-stopped
  init: true
  networks: [readywork]

x-api-environment: &api-environment
  NODE_ENV: development
  DB_PATH: /app/data/readywork.sqlite
  READYWORK_API_HOST: 0.0.0.0
  READYWORK_ALLOWED_ORIGINS: http://47.102.116.148:3001,http://127.0.0.1:13001,http://localhost:13001
  READYWORK_DEMO_AUTH: "1"
  READYWORK_SESSION_SECRET: ${READYWORK_SESSION_SECRET:?READYWORK_SESSION_SECRET is required}
  READYWORK_CREDENTIAL_KEY: ${READYWORK_CREDENTIAL_KEY:?READYWORK_CREDENTIAL_KEY is required}
  READYWORK_INTERNAL_CALLBACK_TOKEN: ${READYWORK_INTERNAL_CALLBACK_TOKEN:?READYWORK_INTERNAL_CALLBACK_TOKEN is required}
  READYWORK_INTERNAL_TOKEN: ${READYWORK_INTERNAL_TOKEN:?READYWORK_INTERNAL_TOKEN is required}
  READYWORK_COLLABORATION_SIGNING_SECRET: ${READYWORK_COLLABORATION_SIGNING_SECRET:?READYWORK_COLLABORATION_SIGNING_SECRET is required}
  READYWORK_HERMES_DASHBOARD_URL: http://dashboard:9119
  READYWORK_HERMES_WEIXIN_ONBOARDING_URL: http://dashboard:9121
  READYWORK_HERMES_DASHBOARD_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:?HERMES_DASHBOARD_SESSION_TOKEN is required}
  READYWORK_HERMES_BRIDGE_URL: http://gateway:8788
  READYWORK_HERMES_BRIDGE_SECRET: ${READYWORK_HERMES_BRIDGE_SECRET:?READYWORK_HERMES_BRIDGE_SECRET is required}
  READYWORK_EMAIL_TRANSPORT_MODE: hermes
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: readywork-workforce

x-hermes-image: &hermes-image
  image: ${READYWORK_HERMES_IMAGE:-nousresearch/hermes-agent:v2026.9.7@sha256:63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7}
  restart: unless-stopped
  networks: [readywork]

x-hermes-environment: &hermes-environment
  HERMES_UID: "10001"
  HERMES_GID: "10001"
  HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:?HERMES_DASHBOARD_SESSION_TOKEN is required}
  READYWORK_BRIDGE_SECRET: ${READYWORK_HERMES_BRIDGE_SECRET:?READYWORK_HERMES_BRIDGE_SECRET is required}
  READYWORK_API_URL: http://business-api:4173
  READYWORK_BRIDGE_HOST: 0.0.0.0
  READYWORK_BRIDGE_PORT: "8788"
  READYWORK_BRIDGE_DATA_DIR: /opt/data/plugin-data/readywork-bridge
  GATEWAY_MULTIPLEX_PROFILES: "true"

services:
  temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${READYWORK_TEMPORAL_DB_PASSWORD:?READYWORK_TEMPORAL_DB_PASSWORD is required}
      POSTGRES_DB: temporal
    volumes:
      - temporal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [readywork]

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${READYWORK_TEMPORAL_DB_PASSWORD:?READYWORK_TEMPORAL_DB_PASSWORD is required}
      POSTGRES_SEEDS: temporal-db
    ports:
      - 127.0.0.1:7233:7233
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [readywork]

  business-api:
    <<: *app-service
    command: ["node", "--import", "tsx", "apps/business-api/src/index.ts"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      <<: *api-environment
      PORT: "4173"
    volumes:
      - /opt/readywork/shared/data:/app/data
    ports:
      - 127.0.0.1:4173:4173
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  control-api:
    <<: *app-service
    command: ["node", "--import", "tsx", "apps/control-plane-api/src/index.ts"]
    depends_on:
      business-api:
        condition: service_healthy
    environment:
      <<: *api-environment
      PORT: "4174"
    volumes:
      - /opt/readywork/shared/data:/app/data
    ports:
      - 127.0.0.1:4174:4174
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  temporal-worker:
    <<: *app-service
    command: ["node", "--import", "tsx", "apps/temporal-worker/src/index.ts"]
    depends_on:
      business-api:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      <<: *api-environment
      READYWORK_AGENT_RUNTIME: dsh
      READYWORK_DSH_REPO: /opt/readywork/runtime/deepseek-harness
      READYWORK_DSH_COMMAND: /opt/readywork/runtime/deepseek-harness/.runtime/node
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
    volumes:
      - /opt/readywork/shared/data:/app/data
      - /opt/readywork/shared/runtime/deepseek-harness:/opt/readywork/runtime/deepseek-harness:ro

  console:
    <<: *app-service
    working_dir: /app/apps/console
    command: ["node", "node_modules/next/dist/bin/next", "start", "-H", "0.0.0.0", "-p", "3001"]
    depends_on:
      business-api:
        condition: service_healthy
      control-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      READYWORK_API_BASE_URL: http://business-api:4173
      READYWORK_CONTROL_PLANE_BASE_URL: http://control-api:4174
    ports:
      - 3001:3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  gateway:
    <<: *hermes-image
    depends_on:
      business-api:
        condition: service_healthy
    environment: *hermes-environment
    volumes:
      - /opt/readywork/shared/hermes:/opt/data
      - ../hermes/plugins/readywork_bridge:/opt/data/plugins/readywork_bridge:ro
      - ../hermes/bootstrap.sh:/opt/readywork/bootstrap.sh:ro
    command: ["/opt/readywork/bootstrap.sh"]
    ports:
      - 127.0.0.1:8788:8788
      - 127.0.0.1:8645:8645
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  dashboard:
    <<: *hermes-image
    depends_on:
      gateway:
        condition: service_healthy
    environment: *hermes-environment
    volumes:
      - /opt/readywork/shared/hermes:/opt/data
      - ../hermes/plugins/readywork_bridge:/opt/data/plugins/readywork_bridge:ro
      - ../hermes/dashboard-bootstrap.sh:/opt/readywork/dashboard-bootstrap.sh:ro
      - ../hermes/dashboard_loopback_proxy.py:/opt/readywork/dashboard_loopback_proxy.py:ro
      - ../hermes/weixin_onboarding_service.py:/opt/readywork/weixin_onboarding_service.py:ro
    command: ["/opt/readywork/dashboard-bootstrap.sh"]
    ports:
      - 127.0.0.1:9119:9119
      - 127.0.0.1:9121:9121
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9119/api/health >/dev/null && curl -fsS http://127.0.0.1:9121/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

volumes:
  temporal_pg:

networks:
  readywork:
    driver: bridge
