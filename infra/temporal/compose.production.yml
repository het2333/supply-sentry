name: readywork-temporal-production

# 生产参考模板：正式部署前应把密码放入 Secret Manager，并按 Temporal
# 官方兼容矩阵配置 TLS、可观测性、备份与高可用副本。
services:
  temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${READYWORK_TEMPORAL_DB_PASSWORD:?READYWORK_TEMPORAL_DB_PASSWORD is required}
      POSTGRES_DB: temporal
    volumes:
      - temporal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [temporal]

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${READYWORK_TEMPORAL_DB_PASSWORD:?READYWORK_TEMPORAL_DB_PASSWORD is required}
      POSTGRES_SEEDS: temporal-db
    ports:
      - "${READYWORK_TEMPORAL_BIND_ADDRESS:-127.0.0.1}:${READYWORK_TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [temporal]

  temporal-ui:
    image: temporalio/ui:2.40.1
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${READYWORK_CONSOLE_ORIGIN:-http://127.0.0.1:3001}
    ports:
      - "${READYWORK_TEMPORAL_BIND_ADDRESS:-127.0.0.1}:${READYWORK_TEMPORAL_UI_PORT:-18082}:8080"
    networks: [temporal]

volumes:
  temporal_pg:

networks:
  temporal:
